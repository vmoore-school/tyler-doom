# Builds the browser version (tools/build_web.py) and publishes it to GitHub Pages.
# Run it from the Actions tab ("Run workflow"). To publish on every push to main instead,
# add `push: {branches: [main]}` under `on:`.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame pygbag==0.9.3
      - run: python tools/build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pygbag/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
